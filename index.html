    --accent-strong: #29C2FF;
    --danger: #FF6B64;
    --danger-soft: rgba(255,107,100,.18);
    --good: #34C98C;
    --good-soft: rgba(52,201,140,.18);
    --warn: #F2A93B;
    --shadow-card: 0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);

    --topbar-bg: rgba(10,15,28,.22);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    background: #0c1226;
    color: var(--ink);
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
  }
  ::selection { background: var(--accent-soft); }

  /* ====== پس‌زمینه‌ی انیمیشنی برای دیده‌شدن افکت شیشه ====== */
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(620px 520px at 12% -8%, rgba(0,180,255,.55), transparent 62%),
      radial-gradient(680px 540px at 106% 6%, rgba(124,92,224,.4), transparent 62%),
      radial-gradient(700px 560px at 88% 102%, rgba(255,105,170,.32), transparent 62%),
      radial-gradient(640px 520px at 4% 104%, rgba(31,169,113,.3), transparent 62%),
      linear-gradient(160deg, #CDE8FF 0%, #EAF4FE 45%, #FFFFFF 100%);
    background-attachment: fixed;
    animation: glow-shift 24s ease-in-out infinite;
  }
  html[data-theme="dark"] .bg-glow {
    background:
      radial-gradient(620px 520px at 12% -8%, rgba(0,180,255,.32), transparent 60%),
      radial-gradient(680px 540px at 106% 6%, rgba(76,141,255,.28), transparent 60%),
      radial-gradient(700px 560px at 88% 102%, rgba(156,135,240,.26), transparent 60%),
      radial-gradient(640px 520px at 4% 104%, rgba(52,201,140,.2), transparent 60%),
      linear-gradient(135deg, #05070f 0%, #060a16 55%, #04070d 100%);
    background-attachment: fixed;
  }
  @keyframes glow-shift {
    0%, 100% { filter: saturate(1) hue-rotate(0deg); }
    50% { filter: saturate(1.18) hue-rotate(10deg); }
  }
  @media (prefers-reduced-motion: reduce) { .bg-glow { animation: none; } }

  .theme-toggle {
    position: fixed; bottom: 16px; left: 16px; z-index: 9999;
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--surface);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-card);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink); font-size: 17px;
    transition: background .25s ease, border-color .25s ease, transform .15s ease;
  }
  .theme-toggle:hover { transform: translateY(-1px); }
  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .icon-moon { display: block; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  /* ---------- Login screen ---------- */
  #login-screen {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 44px 36px 36px;
    box-shadow: var(--shadow-float);
    text-align: center;
    animation: rise .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .login-card h1 { font-size: 19px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
  .login-card p.subtitle { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 28px; }
  .field { margin-bottom: 16px; text-align: right; }
  .field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); margin-bottom: 7px; }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--line);
    background: var(--surface-tint);
    -webkit-backdrop-filter: blur(12px) saturate(160%);
    backdrop-filter: blur(12px) saturate(160%);
    box-shadow: inset 0 1px 4px rgba(15,72,150,.10);
    font-family: var(--font);
    font-size: 14px;
    color: var(--ink);
    outline: none;
    direction: ltr;
    text-align: right;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .field input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
  button { font-family: var(--font); cursor: pointer; }
  button.primary {
    width: 100%;
    padding: 13px;
    border: 1px solid rgba(255,255,255,.45);
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, rgba(23,169,255,.85) 0%, rgba(22,86,245,.85) 100%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    backdrop-filter: blur(14px) saturate(180%);
    color: #fff;
    font-size: 14.5px;
    font-weight: 700;
    margin-top: 8px;
    box-shadow: 0 10px 24px -10px rgba(22,86,245,.55), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
  button.primary:disabled { background: var(--ink-faint); box-shadow: none; cursor: default; transform: none; }
  .login-error {
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 13px;
    font-weight: 500;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    display: none;
    text-align: right;
  }

  /* ---------- App shell ---------- */
  #app-screen { display: none; position: relative; z-index: 1; min-height: 100vh; }
  .topbar-wrap { position: sticky; top: 0; z-index: 10; background: var(--bg); }
  header.topbar {
    background: var(--topbar-bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--line);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
    box-shadow: 0 6px 16px -6px rgba(22,86,245,.5);
  }
  .user-name { font-weight: 700; font-size: 14px; }
  .role-badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-weight: 600;
    font-size: 11.5px;
    padding: 2px 10px;
    border-radius: 999px;
    margin-top: 3px;
  }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .sync-note { font-size: 12px; color: var(--ink-faint); }
  button.ghost {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 0;
    transition: color .15s;
  }
  button.ghost:hover { color: var(--danger); }

  main { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 28px 24px 60px; }

  /* ---------- Summary cards ---------- */
  .summary-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .summary-card {
    background: linear-gradient(135deg, rgba(22,86,245,.62) 0%, rgba(23,169,255,.62) 100%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border: 1px solid rgba(255,255,255,.4);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    flex: 1;
    min-width: 160px;
    box-shadow: 0 16px 34px -16px rgba(22,86,245,.5), inset 0 1px 0 rgba(255,255,255,.45);
    position: relative;
    overflow: hidden;
  }
  .summary-card::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(140px 140px at 90% 0%, rgba(255,255,255,.25), transparent 70%);
  }
  .summary-card .label { font-size: 13px; color: rgba(255,255,255,.9); margin-bottom: 6px; font-weight: 600; position: relative; }
  .summary-card .value { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -.01em; position: relative; }

  /* ---------- Operator own view ---------- */
  .panel {
    background: var(--surface);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .panel-head { padding: 15px 20px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  table.rows { width: 100%; border-collapse: collapse; }
  table.rows tr { transition: background .12s; }
  table.rows tr:hover { background: var(--surface-tint); }
  table.rows td { padding: 13px 20px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
  table.rows tr:last-child td { border-bottom: none; }
  table.rows td.num {
    text-align: left; direction: ltr;
    font-weight: 700; color: var(--accent-strong);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 4px 12px;
    display: inline-block;
    margin: 4px 0;
  }
  table.rows td.num-head { background: none; color: var(--ink-faint) !important; font-weight: 500; padding: 4px 0; }
  .empty-state { padding: 44px 18px; text-align: center; color: var(--ink-faint); font-size: 13px; }

  /* ---------- Org tree ---------- */
  .tree-node { margin-bottom: 6px; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 16px;
    background: var(--surface);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    user-select: none;
    box-shadow: var(--shadow-card);
    transition: border-color .15s, transform .1s;
  }
  .tree-row:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tree-row .chevron {
    width: 14px; text-align: center; color: var(--ink-faint);
    font-size: 11px; transition: transform .25s cubic-bezier(.4,0,.2,1); flex-shrink: 0;
  }
  .tree-row.open .chevron { transform: rotate(90deg); color: var(--accent); }
  .tree-row .leaf-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .tree-row .name { font-weight: 700; font-size: 13.5px; flex-shrink: 0; }
  .tree-row .tree-role {
    font-size: 11px; font-weight: 600; color: var(--accent-strong);
    background: var(--accent-soft); border-radius: 999px; padding: 2px 10px;
    flex-shrink: 0;
  }
  .tree-row .spacer { flex: 1; }
  .tree-row .tree-total { font-size: 13.5px; font-weight: 700; color: var(--ink); direction: ltr; }
  .tree-row .tree-count { font-size: 11px; color: var(--ink-faint); }
  .tree-children {
    margin-inline-start: 24px;
    padding-inline-start: 14px;
    border-inline-start: 1.5px dashed var(--line);
    margin-top: 0;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height .4s cubic-bezier(.4,0,.2,1), opacity .3s ease, margin-top .4s ease;
  }
  .tree-children.open { display: block; max-height: 4000px; opacity: 1; margin-top: 6px; }
  .tree-search {
    width: 100%;
    background: var(--surface-tint);
    -webkit-backdrop-filter: blur(12px) saturate(160%);
    backdrop-filter: blur(12px) saturate(160%);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 11px 15px;
    color: var(--ink);
    font-family: var(--font);
    font-size: 13.5px;
    margin-bottom: 18px;
    box-shadow: inset 0 1px 4px rgba(15,72,150,.10);
  }
  .tree-search:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
  .section-label { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; font-weight: 500; }
  .loading { color: var(--ink-faint); font-size: 13px; padding: 20px 0; }

  .tree-row.clickable-leaf:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .leaf-detail {
    margin-inline-start: 24px;
    padding: 0 14px;
    border-inline-start: 1.5px dashed var(--line);
    margin-top: 0;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height .4s cubic-bezier(.4,0,.2,1), opacity .3s ease, margin-top .4s ease, padding .4s ease;
  }
  .leaf-detail.open { display: block; max-height: 3000px; opacity: 1; margin-top: 6px; padding: 4px 14px 14px; }
  .leaf-detail table.rows {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    margin-top: 8px;
    background: var(--surface);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  }
  .tree-total-group { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .tree-total-group .tree-total.salary { color: var(--good); font-size: 12px; }

  /* team_lead‌ها آبی آسمونی، اپراتورهای زیرشون سفید/شیشه‌ای معمولی می‌مونن */
  .tree-row.role-team_lead {
    background: linear-gradient(135deg, rgba(0,180,255,.16) 0%, rgba(0,180,255,.08) 100%);
    border-color: rgba(0,180,255,.45);
  }
  .tree-row.role-team_lead:hover { border-color: var(--accent); }
  .tree-row.role-team_lead .tree-role {
    background: rgba(0,180,255,.28);
    color: var(--accent-strong);
  }

  /* ---------- Logo / brand ---------- */
  .login-bg-logo {
    position: absolute; inset: 0; z-index: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    overflow: hidden;
  }
  .login-bg-logo img {
    width: min(720px, 140vw);
    opacity: .10;
    filter: blur(.5px);
  }
  html[data-theme="dark"] .login-bg-logo img { opacity: .14; }
  .login-card { position: relative; z-index: 1; }
  .login-logo-top { display: flex; justify-content: center; margin-bottom: 20px; }
  .login-logo-top img { height: 40px; width: auto; }

  .topbar-brand { display: flex; align-items: center; gap: 10px; padding-inline-end: 14px; margin-inline-end: 14px; border-inline-end: 1px solid var(--line); }
  .topbar-brand img { height: 24px; width: auto; }
  @media (max-width: 560px) {
    .topbar-brand { border-inline-end: none; padding-inline-end: 0; margin-inline-end: 0; }
    .topbar-brand img { height: 20px; }
  }
</style>
</head>

</button>

  const html = document.documentElement;

  try { localStorage.setItem('dashboardTheme', next); } catch (e) {}
});

<script>
// =====================================================================
// تنظیمات Supabase — این دو مقدار رو از Project Settings > API بردارید
// =====================================================================
const SUPABASE_URL = "https://xxxx.supabase.co";
const SUPABASE_ANON_KEY = "eyJ...";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// دامنه‌ای که آخر یوزرنیم بهش اضافه می‌شه تا ایمیل واقعی برای Supabase Auth ساخته بشه
const EMAIL_DOMAIN = "bimename.com";

const ROLE_LABELS = {
  operator: "اپراتور",
  team_lead: "سرگروه",
  supervisor: "سرپرست",
  manager: "مدیر",
};

// چند تا روز اخیر رو برای محاسبه‌ی جمع نشون بدیم
const RECENT_DAYS_LIMIT = 200; // سقف تعداد رکورد دریافتی (نه روز تقویمی) — برای جلوگیری از کوئری سنگین

// ---------------------------------------------------------------
// محاسبه‌ی بازه‌ی جاری حقوق: از ۲۱ام هر ماه شمسی تا ۲۰ام ماه بعد
// ---------------------------------------------------------------
function gregorianToJalali(gy, gm, gd) {
  const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  let jy;
  if (gy > 1600) { jy = 979; gy -= 1600; } else { jy = 0; gy -= 621; }
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365 * gy) + (Math.floor((gy2 + 3) / 4)) - (Math.floor((gy2 + 99) / 100)) + (Math.floor((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * Math.floor(days / 12053);
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  let jm, jd;
  if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + (days % 31); }
  else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
  return [jy, jm, jd];
}

function getTodayJalali() {
  const now = new Date();
  const dateFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tehran', year: 'numeric', month: '2-digit', day: '2-digit' });
  const [gy, gm, gd] = dateFmt.format(now).split('-').map(Number);
  return gregorianToJalali(gy, gm, gd);
}

function pad2(n) { return String(n).padStart(2, '0'); }

// بازه‌ی جاری رو برمی‌گردونه: { startSort, endSort, label }
// اگه روز >= ۲۱: بازه از ۲۱ همین ماه تا ۲۰ ماه بعد
// اگه روز < ۲۱: بازه از ۲۱ ماه قبل تا ۲۰ همین ماه
const PERSIAN_MONTHS = [
  'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
  'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'
];

function getCurrentPeriod() {
  const [jy, jm, jd] = getTodayJalali();
  let startY, startM, endY, endM;

  if (jd >= 21) {
    startY = jy; startM = jm;
    endM = jm + 1; endY = jy;
    if (endM > 12) { endM = 1; endY = jy + 1; }
  } else {
    endY = jy; endM = jm;
    startM = jm - 1; startY = jy;
    if (startM < 1) { startM = 12; startY = jy - 1; }
  }

  const startSort = String(startY * 10000 + startM * 100 + 21);
  const endSort = String(endY * 10000 + endM * 100 + 20);
  // بازه با نام ماه پایانی‌اش شناخته می‌شه (مثلاً بازه‌ی ۲۱ شهریور تا ۲۰ مهر = «مهر ماه»)
  // و خودش‌به‌خود با رد شدن از ۲۱ام هر ماه، به ماه بعدی سوییچ می‌کنه
  const monthName = PERSIAN_MONTHS[endM - 1];
  const label = `${monthName} ماه`;

  return { startSort, endSort, label, monthName, startY, startM, endY, endM };
}

const CURRENT_PERIOD = getCurrentPeriod();

let currentProfile = null;      // پروفایل کاربر لاگین‌کرده
let visibleProfiles = [];       // خودش + همه‌ی زیردست‌هایی که RLS اجازه میده ببینه
let profileById = {};
let childrenOf = {};            // reports_to -> [id, id, ...]
let targetsByOperator = {};     // operator_id -> {total, totalSalary, count, lastDate}
let rawTargetsByOperator = {};  // operator_id -> [ {report_date_jalali, target_count, daily_salary}, ... ]

// ---------------------------------------------------------------
// ورود
// ---------------------------------------------------------------
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const usernameOrEmail = document.getElementById('login-username').value.trim();
  const email = usernameOrEmail.includes('@') ? usernameOrEmail : `${usernameOrEmail}@${EMAIL_DOMAIN}`;
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'در حال ورود...';

  let result;
  try {
    result = await supabaseClient.auth.signInWithPassword({ email, password });
  } catch (ex) {
    btn.disabled = false;
    btn.textContent = 'ورود';
    errBox.textContent = 'اتصال به سرور برقرار نشد. آدرس SUPABASE_URL توی کد رو چک کنید. (' + (ex && ex.message ? ex.message : ex) + ')';
    errBox.style.display = 'block';
    return;
  }
  const { data, error } = result;

  btn.disabled = false;
  btn.textContent = 'ورود';

  if (error) {
    if (/invalid.*credentials/i.test(error.message || '')) {
      errBox.textContent = 'نام کاربری یا رمز عبور اشتباه است.';
    } else {
      errBox.textContent = 'خطا: ' + error.message;
    }
    errBox.style.display = 'block';
    return;
  }

  await boot();
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  location.reload();
});

// ---------------------------------------------------------------
// شروع برنامه بعد از لاگین (یا اگر سشن قبلاً فعال بود)
// ---------------------------------------------------------------
async function boot() {
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) return; // هنوز صفحه‌ی لاگین بمونه

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';

  const userId = sessionData.session.user.id;

  const { data: profile, error: profileError } = await supabaseClient
    .from('profiles')
    .select('id, full_name, role, reports_to')
    .eq('id', userId)
    .single();

  if (profileError || !profile) {
    document.getElementById('content-area').innerHTML =
      `<div class="empty-state">خطا در خواندن پروفایل: ${profileError ? profileError.message : 'یافت نشد'}</div>`;
    return;
  }

  currentProfile = profile;
  renderTopbar(profile);
  document.getElementById('period-label').textContent = `دوره‌ی جاری: ${CURRENT_PERIOD.label}`;
  loadSyncStatus();

  if (profile.role === 'operator') {
    await renderOperatorView(profile);
  } else {
    await renderManagerialView(profile);
  }
}

function renderTopbar(profile) {
  document.getElementById('user-name').textContent = profile.full_name || '—';
  document.getElementById('user-role').textContent = ROLE_LABELS[profile.role] || profile.role;
  const initials = (profile.full_name || '?').trim().charAt(0);
  document.getElementById('user-avatar').textContent = initials;
}

async function loadSyncStatus() {
  const { data } = await supabaseClient
    .from('sync_status')
    .select('last_synced_at, records_synced')
    .eq('id', 1)
    .maybeSingle();
  const note = document.getElementById('sync-note');
  if (data && data.last_synced_at) {
    const d = new Date(data.last_synced_at);
    note.textContent = `آخرین به‌روزرسانی: ${d.toLocaleString('fa-IR')}`;
  } else {
    note.textContent = '';
  }
}

// ---------------------------------------------------------------
// نمای اپراتور: فقط رکوردهای خودش
// ---------------------------------------------------------------
async function renderOperatorView(profile) {
  const { data, error } = await supabaseClient
    .from('daily_targets')
    .select('report_date_jalali, report_date_sort, target_count, daily_salary')
    .eq('operator_id', profile.id)
    .gte('report_date_sort', CURRENT_PERIOD.startSort)
    .lte('report_date_sort', CURRENT_PERIOD.endSort)
    .order('report_date_sort', { ascending: false })
    .limit(RECENT_DAYS_LIMIT);

  const summaryRow = document.getElementById('summary-row');
  const content = document.getElementById('content-area');

  if (error) {
    content.innerHTML = `<div class="empty-state">خطا در دریافت اطلاعات: ${error.message}</div>`;
    return;
  }

  const rows = data || [];
  const total = rows.reduce((s, r) => s + (Number(r.target_count) || 0), 0);
  const totalSalary = rows.reduce((s, r) => s + (Number(r.daily_salary) || 0), 0);
  const last = rows[0];

  summaryRow.innerHTML = `
    <div class="summary-card">
      <div class="label">جمع کل حقوق</div>
      <div class="value" style="color:var(--good)">${formatNum(totalSalary)}</div>
    </div>
    <div class="summary-card">
      <div class="label">جمع کل ثبت‌شده</div>
      <div class="value">${formatNum(total)}</div>
    </div>
    <div class="summary-card">
      <div class="label">آخرین روز ثبت‌شده</div>
      <div class="value" style="font-size:16px">${last ? last.report_date_jalali : '—'}</div>
    </div>
    <div class="summary-card">
      <div class="label">تعداد روزهای ثبت‌شده</div>
      <div class="value">${formatNum(rows.length)}</div>
    </div>
  `;

  if (rows.length === 0) {
    content.innerHTML = '<div class="panel"><div class="empty-state">هنوز رکوردی برای شما ثبت نشده است</div></div>';
    return;
  }

  content.innerHTML = `
    <div class="tree-node">
      <div class="tree-row role-team_lead" id="month-card-toggle">
        <span class="chevron">◀</span>
        <span class="name">${CURRENT_PERIOD.label}</span>
        <span class="spacer"></span>
        <span class="tree-count">${formatNum(rows.length)} روز ثبت‌شده</span>
      </div>
      <div class="tree-children" id="month-card-detail">
        <table class="rows">
          <tr>
            <td class="num-head">تاریخ</td>
            <td class="num num-head">عملکرد</td>
            <td class="num num-head">حقوق روز</td>
          </tr>
          ${rows.map(r => `
            <tr>
              <td>${r.report_date_jalali}</td>
              <td class="num">${r.target_count != null ? formatNum(r.target_count) : '—'}</td>
              <td class="num" style="color:var(--good)">${r.daily_salary != null ? formatNum(r.daily_salary) : '—'}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    </div>
  `;

  const toggle = document.getElementById('month-card-toggle');
  const detail = document.getElementById('month-card-detail');
  toggle.addEventListener('click', () => {
    toggle.classList.toggle('open');
    detail.classList.toggle('open');
  });
}

// ---------------------------------------------------------------
// نمای مدیریتی (team_lead / supervisor / manager): درخت زیردست‌ها
// ---------------------------------------------------------------
async function renderManagerialView(profile) {
  const content = document.getElementById('content-area');
  content.innerHTML = '<div class="loading">در حال بارگذاری ساختار تیم...</div>';

  // RLS خودش فقط خود کاربر + زیردست‌هاش رو برمی‌گردونه
  const { data: profiles, error: profilesError } = await supabaseClient
    .from('profiles')
    .select('id, full_name, role, reports_to');

  if (profilesError) {
    content.innerHTML = `<div class="empty-state">خطا در دریافت لیست افراد: ${profilesError.message}</div>`;
    return;
  }

  visibleProfiles = profiles || [];
  profileById = {};
  childrenOf = {};
  visibleProfiles.forEach(p => {
    profileById[p.id] = p;
    if (p.reports_to) {
      (childrenOf[p.reports_to] = childrenOf[p.reports_to] || []).push(p.id);
    }
  });

  // RLS خودش فقط رکوردهای خود کاربر + زیردست‌هاش رو برمی‌گردونه
  const { data: targets, error: targetsError } = await supabaseClient
    .from('daily_targets')
    .select('operator_id, report_date_jalali, report_date_sort, target_count, daily_salary')
    .gte('report_date_sort', CURRENT_PERIOD.startSort)
    .lte('report_date_sort', CURRENT_PERIOD.endSort)
    .order('report_date_sort', { ascending: false })
    .limit(5000);

  if (targetsError) {
    content.innerHTML = `<div class="empty-state">خطا در دریافت تارگت‌ها: ${targetsError.message}</div>`;
    return;
  }

  targetsByOperator = {};
  rawTargetsByOperator = {};
  (targets || []).forEach(r => {
    const bucket = (targetsByOperator[r.operator_id] = targetsByOperator[r.operator_id] || { total: 0, totalSalary: 0, count: 0, lastDate: null });
    bucket.total += Number(r.target_count) || 0;
    bucket.totalSalary += Number(r.daily_salary) || 0;
    bucket.count += 1;
    if (!bucket.lastDate || r.report_date_sort > bucket.lastDateSort) {
      bucket.lastDate = r.report_date_jalali;
      bucket.lastDateSort = r.report_date_sort;
    }
    (rawTargetsByOperator[r.operator_id] = rawTargetsByOperator[r.operator_id] || []).push(r);
  });

  // جمع کل زیردرخت هر گره (برای نودهای غیر اپراتور هم جمع بزنیم) — هم عملکرد، هم حقوق
  const subtreeTotal = {};
  const subtreeSalary = {};
  function computeSubtree(id) {
    if (subtreeTotal[id] !== undefined) return subtreeTotal[id];
    const own = targetsByOperator[id] ? targetsByOperator[id].total : 0;
    const ownSalary = targetsByOperator[id] ? targetsByOperator[id].totalSalary : 0;
    const kids = childrenOf[id] || [];
    let kidsSum = 0, kidsSalarySum = 0;
    kids.forEach(cid => { kidsSum += computeSubtree(cid); kidsSalarySum += subtreeSalary[cid]; });
    subtreeSalary[id] = ownSalary + kidsSalarySum;
    return (subtreeTotal[id] = own + kidsSum);
  }
  visibleProfiles.forEach(p => computeSubtree(p.id));
  window.__subtreeSalary = subtreeSalary; // برای استفاده‌ی buildNodeHtml

  const directReports = (childrenOf[profile.id] || []).length;
  const totalTeam = visibleProfiles.length - 1; // منهای خود کاربر
  const grandTotal = computeSubtree(profile.id);
  const grandTotalSalary = subtreeSalary[profile.id] || 0;

  document.getElementById('summary-row').innerHTML = `
    <div class="summary-card">
      <div class="label">جمع کل حقوق تیم</div>
      <div class="value" style="color:var(--good)">${formatNum(grandTotalSalary)}</div>
    </div>
    <div class="summary-card">
      <div class="label">جمع کل عملکرد تیم</div>
      <div class="value">${formatNum(grandTotal)}</div>
    </div>
    <div class="summary-card">
      <div class="label">زیرمجموعه‌ی مستقیم</div>
      <div class="value">${formatNum(directReports)}</div>
    </div>
    <div class="summary-card">
      <div class="label">کل زیرمجموعه</div>
      <div class="value">${formatNum(totalTeam)}</div>
    </div>
  `;

  content.innerHTML = `
    <input type="text" class="tree-search" id="tree-search" placeholder="جستجوی نام...">
    <div class="section-label">ساختار زیرمجموعه</div>
    <div id="tree-root"></div>
  `;

  renderTree(profile.id, subtreeTotal);

  document.getElementById('tree-search').addEventListener('input', (e) => {
    filterTree(e.target.value.trim());
  });
}

function renderTree(rootId, subtreeTotal) {
  const container = document.getElementById('tree-root');
  const kids = childrenOf[rootId] || [];
  if (kids.length === 0) {
    container.innerHTML = '<div class="empty-state">زیرمجموعه‌ای ثبت نشده است</div>';
    return;
  }
  container.innerHTML = kids.map(id => buildNodeHtml(id, subtreeTotal)).join('');
  attachTreeHandlers(container);
}

function buildNodeHtml(id, subtreeTotal) {
  const p = profileById[id];
  const kids = childrenOf[id] || [];
  const isLeaf = kids.length === 0;
  const own = targetsByOperator[id];
  const total = subtreeTotal[id] || 0;
  const salaryTotal = (window.__subtreeSalary && window.__subtreeSalary[id]) || 0;

  const totalLabel = isLeaf
    ? (own ? formatNum(own.total) : '—')
    : formatNum(total);
  const salaryLabel = isLeaf
    ? (own ? formatNum(own.totalSalary) : '—')
    : formatNum(salaryTotal);
  const countLabel = isLeaf
    ? (own ? `${formatNum(own.count)} روز` : 'بدون رکورد')
    : `${formatNum(kids.length)} زیرمجموعه`;

  return `
    <div class="tree-node" data-name="${(p.full_name || '').toLowerCase()}">
      <div class="tree-row ${isLeaf ? 'clickable-leaf' : ''} role-${p.role}" data-id="${id}" data-leaf="${isLeaf}">
        ${isLeaf ? '<span class="leaf-dot"></span>' : '<span class="chevron">◀</span>'}
        <span class="name">${p.full_name || '—'}</span>
        <span class="tree-role">${ROLE_LABELS[p.role] || p.role}</span>
        <span class="spacer"></span>
        <span class="tree-count">${countLabel}</span>
        <div class="tree-total-group">
          <span class="tree-total">${totalLabel}</span>
          <span class="tree-total salary">${salaryLabel}</span>
        </div>
      </div>
      ${!isLeaf ? `<div class="tree-children" id="children-${id}"></div>` : `<div class="leaf-detail" id="detail-${id}"></div>`}
    </div>
  `;
}

function buildLeafDetailHtml(id) {
  const rows = (rawTargetsByOperator[id] || []).slice().sort((a, b) => (a.report_date_sort < b.report_date_sort ? 1 : -1));
  if (rows.length === 0) {
    return '<div class="empty-state">رکوردی برای این فرد ثبت نشده است</div>';
  }
  return `
    <table class="rows">
      <tr>
        <td style="color:var(--text-faint)">تاریخ</td>
        <td class="num num-head">عملکرد</td>
        <td class="num num-head">حقوق روز</td>
      </tr>
      ${rows.map(r => `
        <tr>
          <td>${r.report_date_jalali}</td>
          <td class="num">${r.target_count != null ? formatNum(r.target_count) : '—'}</td>
          <td class="num" style="color:var(--good)">${r.daily_salary != null ? formatNum(r.daily_salary) : '—'}</td>
        </tr>
      `).join('')}
    </table>
  `;
}

function attachTreeHandlers(scope) {
  scope.querySelectorAll('.tree-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.getAttribute('data-id');
      const isLeaf = row.getAttribute('data-leaf') === 'true';

      if (isLeaf) {
        const detailBox = document.getElementById(`detail-${id}`);
        if (!detailBox) return;
        const isOpen = detailBox.classList.contains('open');
        if (isOpen) {
          detailBox.classList.remove('open');
          row.classList.remove('open');
          return;
        }
        if (detailBox.children.length === 0) {
          detailBox.innerHTML = buildLeafDetailHtml(id);
        }
        detailBox.classList.add('open');
        row.classList.add('open');
        return;
      }

      const kids = childrenOf[id] || [];
      if (kids.length === 0) return;

      const childrenBox = document.getElementById(`children-${id}`);
      const isOpen = childrenBox.classList.contains('open');

      if (isOpen) {
        childrenBox.classList.remove('open');
        row.classList.remove('open');
        return;
      }

      if (childrenBox.children.length === 0) {
        // لازی-لود: فرزندها رو فقط موقع اولین باز شدن بساز
        const subtreeTotal = {};
        function computeSubtree(nid) {
          if (subtreeTotal[nid] !== undefined) return subtreeTotal[nid];
          const own = targetsByOperator[nid] ? targetsByOperator[nid].total : 0;
          const k = childrenOf[nid] || [];
          const kidsSum = k.reduce((s, cid) => s + computeSubtree(cid), 0);
          return (subtreeTotal[nid] = own + kidsSum);
        }
        visibleProfiles.forEach(p => computeSubtree(p.id));
        childrenBox.innerHTML = kids.map(cid => buildNodeHtml(cid, subtreeTotal)).join('');
        attachTreeHandlers(childrenBox);
      }

      childrenBox.classList.add('open');
      row.classList.add('open');
    });
  });
}

function filterTree(query) {
  const q = query.toLowerCase();
  const root = document.getElementById('tree-root');
  if (!q) {
    // بازگشت به حالت اولیه‌ی جمع‌شده
    renderTree(currentProfile.id, computeAllSubtotals());
    return;
  }
  // جستجوی ساده: همه‌ی افرادی که اسمشون match می‌کنه رو مسطح نشون بده
  const matches = visibleProfiles.filter(p => (p.full_name || '').toLowerCase().includes(q) && p.id !== currentProfile.id);
  if (matches.length === 0) {
    root.innerHTML = '<div class="empty-state">کسی با این نام پیدا نشد</div>';
    return;
  }
  const subtreeTotal = computeAllSubtotals();
  root.innerHTML = matches.map(p => buildNodeHtml(p.id, subtreeTotal)).join('');
  attachTreeHandlers(root);
}

function computeAllSubtotals() {
  const subtreeTotal = {};
  const subtreeSalary = {};
  function computeSubtree(id) {
    if (subtreeTotal[id] !== undefined) return subtreeTotal[id];
    const own = targetsByOperator[id] ? targetsByOperator[id].total : 0;
    const ownSalary = targetsByOperator[id] ? targetsByOperator[id].totalSalary : 0;
    const kids = childrenOf[id] || [];
    let kidsSum = 0, kidsSalarySum = 0;
    kids.forEach(cid => { kidsSum += computeSubtree(cid); kidsSalarySum += subtreeSalary[cid]; });
    subtreeSalary[id] = ownSalary + kidsSalarySum;
    return (subtreeTotal[id] = own + kidsSum);
  }
  visibleProfiles.forEach(p => computeSubtree(p.id));
  window.__subtreeSalary = subtreeSalary;
  return subtreeTotal;
}

function formatNum(n) {
  return Number(n).toLocaleString('fa-IR');
}

// اگر قبلاً لاگین بوده (سشن ذخیره‌شده در مرورگر)، مستقیم برو تو
boot();
</script>
